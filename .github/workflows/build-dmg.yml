name: Build DMG and update release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app (from submodule)
        run: cd web && npm ci && npm run build -- --base=./

      - name: Build DMGs (Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Update release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # New release on every commit: append the CI build number so each
          # push gets its own unique tag (v0.3.0-46, v0.3.0-47, ...).
          TAG="v$VERSION-$GITHUB_RUN_NUMBER"
          echo "Releasing $TAG"
          {
            echo "Auto-built from latest commit."
            echo ""
            echo "**For most people — use the web version (nothing to install):** https://dineshkota3.github.io/photostacker/"
            echo ""
            echo "This desktop DMG adds Move-to-Trash but is unsigned, so macOS blocks it with a misleading 'damaged' message. Install manually: drag Photo Stacker.app to Applications, run 'xattr -cr \"/Applications/Photo Stacker.app\"' in Terminal once, then open normally."
          } > /tmp/notes.md
          gh release create "$TAG" --title "Photo Stacker $TAG" --notes-file /tmp/notes.md --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" \
            "release/Photo Stacker-$VERSION-arm64.dmg" \
            "release/Photo Stacker-$VERSION.dmg#Photo Stacker $VERSION (Intel Mac)" \
            --repo "$GITHUB_REPOSITORY" --clobber
