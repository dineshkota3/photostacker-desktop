name: Build DMG and update release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app (from submodule)
        run: cd web && npm ci && npm run build -- --base=./

      - name: Build DMGs (Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Update release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Releasing $TAG"
          {
            echo "Auto-built from latest main."
            echo ""
            echo "**Install:** open the DMG and double-click **START HERE** — it installs the app to /Applications and opens it. If macOS asks, click Open/Allow. No Terminal needed."
            echo ""
            echo "Manual alternative: drag Photo Stacker.app to Applications and run 'xattr -cr \"/Applications/Photo Stacker.app\"' in Terminal once (macOS shows a misleading 'damaged' message on unsigned downloads)."
          } > /tmp/notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --title "Photo Stacker $VERSION" --notes-file /tmp/notes.md
          gh release upload "$TAG" \
            "release/Photo Stacker-$VERSION-arm64.dmg" \
            "release/Photo Stacker-$VERSION.dmg#Photo Stacker $VERSION (Intel Mac)" \
            --repo "$GITHUB_REPOSITORY" --clobber
