name: Build DMG and update release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app (from submodule)
        run: cd web && npm ci && npm run build -- --base=./

      - name: Build DMGs (Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          # unsigned personal build, same as local
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc code sign (required for Apple Silicon to run at all)
        run: |
          codesign --force --deep --sign - "release/mac-arm64/Photo Stacker.app" || true
          codesign --force --deep --sign - "release/mac/Photo Stacker.app" || true

      - name: Update release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag follows the version in package.json
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Releasing $TAG"
          cat > /tmp/notes.md <<'NOTES'
Auto-built from latest main.

**Install:** drag Photo Stacker.app to Applications, then run this in Terminal once (macOS blocks unsigned downloads with a misleading "damaged" message):

    xattr -cr "/Applications/Photo Stacker.app"

Then open the app normally.
NOTES
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --title "Photo Stacker $VERSION" --notes-file /tmp/notes.md
          gh release upload "$TAG" \
            "release/Photo Stacker-$VERSION-arm64.dmg" \
            "release/Photo Stacker-$VERSION.dmg#Photo Stacker $VERSION (Intel Mac)" \
            --repo "$GITHUB_REPOSITORY" --clobber
